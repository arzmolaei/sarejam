name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and unit tests
        run: ./gradlew build test --stacktrace
      - name: Test count
        run: cat $(find . -path '*/test-results/*' -name '*.xml') | grep -o '<testsuite [^>]*' | grep -oE 'tests="[0-9]+"|failures="[0-9]+"' | sort | uniq -c
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest --continue
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p shots
            adb shell wm size 360x780
            for m in light dark black; do adb shell am force-stop ir.sarejam.app; adb shell am start -W -n ir.sarejam.app/.MainActivity --es theme_mode $m; sleep 4; adb exec-out screencap -p > shots/$m-api${{ matrix.api }}.png; done
            adb shell input keyevent KEYCODE_HOME && sleep 2 && adb shell input swipe 180 700 180 150 300 && sleep 3 && adb exec-out screencap -p > shots/apps-api${{ matrix.api }}.png
            adb install -r app/build/outputs/apk/release/app-release.apk && adb shell am start -W -n ir.sarejam.app/.MainActivity && sleep 4 && adb exec-out screencap -p > shots/release-api${{ matrix.api }}.png && adb shell pidof ir.sarejam.app
            for a in com.android.launcher3 com.google.android.apps.nexuslauncher; do adb shell content update --uri content://$a.grid_control/icon_themed --bind boolean_value:b:true 2>/dev/null || true; done
            adb shell input keyevent KEYCODE_HOME && sleep 3 && adb shell input swipe 180 700 180 150 300 && sleep 3 && adb exec-out screencap -p > shots/apps-themed-api${{ matrix.api }}.png
      - name: Publish screenshots to the ci-screenshots branch (for review)
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p shots && cp -r core/database/schemas shots/ 2>/dev/null || true
          mkdir -p shots/results && find . -path '*/outputs/androidTest-results/connected/*' -name '*.xml' -print0 | tar --null -cf - -T - | tar -xf - -C shots/results || true
          grep -rh -A4 '<failure' shots/results | cut -c1-300 | head -60 || true
          cd shots || exit 0
          git init -q -b ci-screenshots && git add . 
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-api${{ matrix.api }}
          path: |
            shots/
            app/build/reports/androidTests/
