name: Release
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAREJAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret SAREJAM_KEYSTORE_BASE64 is missing — see docs/RELEASE.md"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SAREJAM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Version from tag
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "SAREJAM_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "SAREJAM_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Build, test and sign
        env:
          SAREJAM_KEYSTORE_PASSWORD: ${{ secrets.SAREJAM_KEYSTORE_PASSWORD }}
          SAREJAM_KEY_ALIAS: ${{ secrets.SAREJAM_KEY_ALIAS }}
          SAREJAM_KEY_PASSWORD: ${{ secrets.SAREJAM_KEY_PASSWORD }}
        run: |
          ./gradlew test :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "sarejam-${SAREJAM_VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "sarejam-${SAREJAM_VERSION_NAME}.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          sha256sum "sarejam-${SAREJAM_VERSION_NAME}.apk" > "sarejam-${SAREJAM_VERSION_NAME}.apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "نسخه ${SAREJAM_VERSION_NAME}" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$GITHUB_REF_NAME" "sarejam-${SAREJAM_VERSION_NAME}.apk" "sarejam-${SAREJAM_VERSION_NAME}.apk.sha256" \
            --title "سرجمع ${SAREJAM_VERSION_NAME}" --notes-file "$notes"
