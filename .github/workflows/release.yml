name: Release
# A tag v* builds the release APK.
# - With Secrets (docs/RELEASE.md): signed here and published right away.
# - Without Secrets: the unsigned APK is put on branch release-staging/<tag> (with TAG and COMMIT);
#   the owner's key signs it outside GitHub; release/signed.apk + release/TAG + release/COMMIT are
#   pushed in one commit and publish-signed.yml publishes it (that commit is then dropped again).
# Either way the published APK must carry the certificate pinned in docs/signing-cert.sha256.
# Started by a v* tag, or (without push rights for tags) by a commit that adds release/REQUEST
# containing the version, e.g. 0.1.0. GitHub applies path filters to branch pushes only.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
    paths: [ "release/REQUEST" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Signing mode
        env:
          KEYSTORE_BASE64: ${{ secrets.SAREJAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SAREJAM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "MODE=ci" >> "$GITHUB_ENV"
          else
            echo "SAREJAM_UNSIGNED=1" >> "$GITHUB_ENV"
            echo "MODE=offline" >> "$GITHUB_ENV"
          fi
      - name: Version from tag or input
        run: |
          if [ -f release/REQUEST ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            name="$(tr -d '[:space:]' < release/REQUEST)"
            echo "BUILT_COMMIT=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            name="${GITHUB_REF_NAME#v}"; echo "BUILT_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
          echo "TAG=v$name" >> "$GITHUB_ENV"
          IFS=. read -r major minor patch <<< "$name"
          echo "SAREJAM_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "SAREJAM_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          SAREJAM_KEYSTORE_PASSWORD: ${{ secrets.SAREJAM_KEYSTORE_PASSWORD }}
          SAREJAM_KEY_ALIAS: ${{ secrets.SAREJAM_KEY_ALIAS }}
          SAREJAM_KEY_PASSWORD: ${{ secrets.SAREJAM_KEY_PASSWORD }}
        run: |
          ./gradlew test :app:assembleRelease --no-build-cache
          rm -f "$RUNNER_TEMP/release.jks"
          ls app/build/outputs/apk/release/
      - name: Hand the unsigned APK over for signing (no Secrets)
        if: env.MODE == 'offline'
        run: |
          mkdir staging && cp app/build/outputs/apk/release/app-release-unsigned.apk staging/unsigned.apk
          echo "$TAG" > staging/TAG
          echo "$BUILT_COMMIT" > staging/COMMIT
          cd staging && git init -q -b staging && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "unsigned $GITHUB_REF_NAME" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "staging:release-staging/$TAG"
          echo "::notice::Unsigned APK is on branch release-staging/$TAG; waiting for release/signed.apk"
      - name: Publish (Secrets)
        if: env.MODE == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "sarejam-${SAREJAM_VERSION_NAME}.apk"
          .github/scripts/publish.sh "$TAG" "sarejam-${SAREJAM_VERSION_NAME}.apk" "$BUILT_COMMIT"
