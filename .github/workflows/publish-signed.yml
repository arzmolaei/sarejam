name: Publish signed release
# Publishes an APK signed outside GitHub (see release.yml): runs when release/signed.apk is pushed,
# checks the pinned certificate and version, then creates the tag + Release on the built commit.
on:
  push:
    paths: [ "release/signed.apk" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < release/TAG)"; COMMIT="$(tr -d '[:space:]' < release/COMMIT)"
          apk="sarejam-${TAG#v}.apk"
          cp release/signed.apk "$apk"
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$aapt" dump badging "$apk" | grep -q "versionName='${TAG#v}'" || { echo "::error::version does not match $TAG"; exit 1; }
          git fetch -q origin "$COMMIT" && git show -s --format=%H "$COMMIT"
          git show "$COMMIT:.github/scripts/publish.sh" > /tmp/publish.sh && git show "$COMMIT:docs/signing-cert.sha256" > docs/signing-cert.sha256
          bash /tmp/publish.sh "$TAG" "$apk" "$COMMIT"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" --delete "release-staging/$TAG" || true
